[project]
name = "pln-thrml"
version = "0.2.0"
description = "PLN inference rules compiled to thermodynamic factor graphs"
requires-python = ">=3.10"
dependencies = [
    "thrml>=0.1.3,<0.3",
    "jax>=0.4,<0.6",
]

[project.optional-dependencies]
metta = ["hyperon"]
dev = ["pytest", "hyperon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: scalability tests (upstream PLN examples + long chains) — run with -m slow",
]
