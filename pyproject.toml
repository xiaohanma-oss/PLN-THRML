[project]
name = "pln-thrml"
version = "0.2.0"
description = "PLN inference rules compiled to thermodynamic factor graphs"
requires-python = ">=3.10"
dependencies = [
    "thrml>=0.1.3",
    "jax>=0.4,<0.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
metta = ["hyperon"]
dev = ["pytest", "hyperon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
